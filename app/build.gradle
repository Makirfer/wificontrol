plugins {
    id 'com.android.application'
}

android {
    namespace 'com.makirfer.wifitimecontrol'
    compileSdk 35

    defaultConfig {
        applicationId 'com.makirfer.wifitimecontrol'
        minSdk 26
        targetSdk 35
        versionCode 31
        versionName '3.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firmado con la clave de depuración para poder instalarlo directamente.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Lectura de la pegatina del router: reconocimiento de texto en el propio móvil, sin conexión.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
